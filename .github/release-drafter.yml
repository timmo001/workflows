---
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
sort-direction: ascending

categories:
  - title: "🚨 Breaking changes"
    labels:
      - "Breaking Change"
  - title: "✨ New features"
    labels:
      - "Feature"
  - title: "🐛 Bug fixes"
    labels:
      - "Bug Fix"
  - title: "🚀 Enhancements"
    labels:
      - "Enhancement"
      - "Refactor"
      - "Performance"
  - title: "🧰 Maintenance"
    labels:
      - "Maintenance"
      - "CI"
  - title: "📚 Documentation"
    labels:
      - "Documentation"
  - title: "⬆️ Dependency updates"
    labels:
      - "Dependencies"

version-resolver:
  major:
    labels:
      - "Breaking Change"
  minor:
    labels:
      - "Feature"
  patch:
    labels:
      - "Bug Fix"
      - "CI"
      - "Dependencies"
      - "Documentation"
      - "Enhancement"
      - "Maintenance"
      - "Performance"
      - "Refactor"
  default: patch

template: |
  ## What’s changed

  $CHANGES
