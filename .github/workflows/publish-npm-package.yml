---
name: Publish npm package

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      bun-version:
        description: "Bun version"
        required: false
        type: string
        # renovate: datasource=npm depName=bun
        default: "1.4.0"
      node-version:
        description: "Node.js version"
        required: false
        type: string
        # renovate: datasource=node-version depName=node versioning=node
        default: "26.8.1"
      npm-version:
        description: "npm CLI version with trusted publishing support"
        required: false
        type: string
        # renovate: datasource=npm depName=npm
        default: "12.0.2"
      package-path:
        description: "Directory containing the package"
        required: false
        type: string
        default: "."
      check-command:
        description: "Trusted command that validates the package"
        required: false
        type: string
        default: "bun run check"
      build-command:
        description: "Trusted command that builds the package"
        required: false
        type: string
        default: "bun run build"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install npm
        run: npm install --global "npm@${NPM_VERSION}"
        env:
          NPM_VERSION: ${{ inputs.npm-version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ${{ inputs.package-path }}
      - name: Validate release
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          CHECK_COMMAND: ${{ inputs.check-command }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        shell: bash
        working-directory: ${{ inputs.package-path }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$RELEASE_TAG" == "$version" ]] || {
            echo "::error::Release tag $RELEASE_TAG does not match package version $version"
            exit 1
          }
          # These commands are trusted caller configuration, not release content.
          bash -euo pipefail -c "$CHECK_COMMAND"
          bash -euo pipefail -c "$BUILD_COMMAND"
          npm pack --dry-run
      - name: Publish package
        run: npm publish --access public
        working-directory: ${{ inputs.package-path }}
