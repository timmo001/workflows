---
name: Release

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: false
        type: string
        # renovate: datasource=node-version depName=node versioning=node
        default: "26.10.0"
      dist-glob:
        description: "Glob pattern for release assets; with attest, newline-separated patterns that each match exactly one file"
        required: false
        type: string
        default: "dist/*.js"
      submodules:
        description: "Checkout submodules recursively"
        required: false
        type: boolean
        default: false
      attest:
        description: >-
          Attest the release assets and upload the Sigstore bundle; the caller job must grant id-token and attestations write
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # No permissions block: the job inherits the caller's grant, so callers
    # that enable attest can pass id-token and attestations write without
    # breaking callers that only grant contents write.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Attest release assets
        id: attest
        if: inputs.attest
        uses: $/.github/actions/attest-release-assets
        with:
          subject-patterns: ${{ inputs.dist-glob }}
          bundle-path: dist/${{ github.event.repository.name }}-${{ github.ref_name }}.sigstore.json
      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ inputs.attest && steps.attest.outputs.subjects || inputs.dist-glob }}
            ${{ steps.attest.outputs.bundle-path }}
