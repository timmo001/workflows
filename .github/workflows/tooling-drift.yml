---
name: Tooling drift

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      install:
        description: "Run `mise run install` before publishing, for update commands that need the repository's dependencies"
        required: false
        type: boolean
        default: false
    secrets:
      token:
        description: >-
          Token with contents, pull requests and actions write access; empty uses GITHUB_TOKEN and dispatches CI on each branch
        required: false

permissions:
  contents: read

jobs:
  drift:
    name: Tooling drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.token || github.token }}
      TOOLING_DRIFT_DISPATCH: ${{ secrets.token == '' }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Install dependencies
        if: inputs.install
        run: mise run install
      - name: Open or refresh pull requests
        run: mise run tooling:publish
