---
name: Tooling drift

# yamllint disable-line rule:truthy
on:
  workflow_call:
    secrets:
      token:
        description: >-
          Token with contents, pull requests and actions write access; empty uses GITHUB_TOKEN and dispatches CI on each branch
        required: false

permissions:
  contents: read

jobs:
  drift:
    name: Tooling drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.token || github.token }}
      TOOLING_DRIFT_DISPATCH: ${{ secrets.token == '' }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}
      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Open or refresh pull requests
        run: mise run tooling:publish
