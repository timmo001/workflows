---
name: Build Python Package for PyPI Release

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      package-name:
        description: "PyPI distribution name"
        required: true
        type: string
      python-version:
        description: "Python version used to build and validate distributions"
        required: false
        type: string
        # renovate: datasource=python-version depName=python versioning=python
        default: "3.14.7"
    outputs:
      artifact-name:
        description: "Validated distribution artifact name"
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

concurrency:
  group: release-python-pypi-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Validate release event
        uses: $/.github/actions/build-python-pypi-release
        with:
          stage: validate-event
          eventName: ${{ github.event_name }}
          eventAction: ${{ github.event.action }}
          releaseDraft: ${{ github.event.release.draft }}
          releasePrerelease: ${{ github.event.release.prerelease }}
          releaseTag: ${{ github.event.release.tag_name }}
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify immutable release source
        uses: $/.github/actions/build-python-pypi-release
        with:
          stage: validate-source
          releaseTag: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: pip
          python-version: ${{ inputs.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade build packaging twine
      - name: Validate stable release tag
        uses: $/.github/actions/build-python-pypi-release
        with:
          stage: validate-tag
          releaseTag: ${{ github.event.release.tag_name }}
      - name: Build distributions
        run: |
          rm -rf dist
          python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Validate distribution metadata
        uses: $/.github/actions/build-python-pypi-release
        with:
          stage: validate-distributions
          packageName: ${{ inputs.package-name }}
          releaseTag: ${{ github.event.release.tag_name }}
      - name: Set artifact name
        id: artifact
        run: |
          echo "name=python-package-distributions-${{ github.run_id }}-${{ github.run_attempt }}" \
            >> "$GITHUB_OUTPUT"
      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
