---
name: Build pnpm

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: false
        type: string
        # renovate: datasource=node-version depName=node versioning=node
        default: "26.8.1"
      code-path:
        description: "Directory containing the pnpm project"
        required: false
        type: string
        default: "."
      build-command:
        description: "Command used to build the project"
        required: false
        type: string
        default: "pnpm build"
      additional-build-commands:
        description: "Commands to run after the build"
        required: false
        type: string
      artifact-name:
        description: "Uploaded artifact name"
        required: false
        type: string
        default: "build"
      artifact-path:
        description: "Path to upload; omit to disable artifact upload"
        required: false
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.code-path }}/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ inputs.code-path }}
      - name: Build
        run: |
          ${{ inputs.build-command }}
          ${{ inputs.additional-build-commands }}
        working-directory: ${{ inputs.code-path }}
      - name: Upload artifact
        if: ${{ inputs.artifact-path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
