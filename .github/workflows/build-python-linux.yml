---
name: Build Python Linux

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version"
        required: false
        type: string
        # renovate: datasource=python-version depName=python versioning=python
        default: "3.15.1"
      additional-artifacts-name:
        required: false
        type: string
      additional-artifacts-path:
        required: false
        type: string
      code-path:
        required: false
        type: string
        default: "."
      pre-install-command:
        required: false
        type: string

jobs:
  build-python-linux:
    name: 🚀 Build Application - Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⬇️ Download additional artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.additional-artifacts-name }}
        with:
          name: ${{ inputs.additional-artifacts-name }}
          path: ${{ inputs.additional-artifacts-path }}
      - name: 🏗️ Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          architecture: "x64"
          cache: "pip"
          check-latest: true
          python-version: ${{ inputs.python-version }}
      - name: 🏗️ Install setuptools, wheel
        run: |
          python -V
          pip -V
          pip install --upgrade uv
          uv venv
          uv pip install --upgrade setuptools wheel
      - name: 🚀 Run pre-install-command
        if: ${{ inputs.pre-install-command }}
        run: |
          cd ${{ inputs.code-path }}
          ${{ inputs.pre-install-command }}
      - name: 🏗️ Install package
        run: |
          cd ${{ inputs.code-path }}
          uv pip install .
