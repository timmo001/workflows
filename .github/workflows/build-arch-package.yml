---
name: Build Arch package

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      package-name:
        description: "Allowlisted Arch package name"
        required: true
        type: string
      package-files-artifact-name:
        description: "Same-run artifact containing a prepared package build context"
        required: false
        type: string
        default: ""
      pkgbuild-path:
        description: "Path to the PKGBUILD within the source or prepared artifact"
        required: false
        type: string
        default: ".scripts/linux/PKGBUILD"
    secrets:
      ARCH_REPO_DISPATCH_TOKEN:
        description: "Token limited to dispatching timmo001/arch-repo"
        required: true
    outputs:
      artifact-name:
        description: "Validated package artifact name"
        value: ${{ jobs.validate.outputs.artifact-name }}

permissions:
  contents: read

concurrency:
  group: build-arch-package-${{ github.repository }}-${{ github.sha }}-${{ inputs.package-name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:latest@sha256:63c7b061c0c001cb7ce4f8d11b63d351c23e7f97121bc5c8bd5d9f431e615d7d # renovate-container: datasource=docker depName=archlinux
    steps:
      - name: Install build tooling
        run: pacman -Syu --noconfirm --needed base-devel curl git jq sudo
      - name: Validate build contract
        uses: $/.github/actions/build-arch-package
        with:
          stage: validate-contract
          packageName: ${{ inputs.package-name }}
          pkgbuildPath: ${{ inputs.pkgbuild-path }}
          sourceRepository: ${{ github.repository }}
          sourceSha: ${{ github.sha }}
          allowlistUrl: https://raw.githubusercontent.com/timmo001/arch-repo/refs/heads/main/config/packages.json
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download prepared package files
        if: inputs.package-files-artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.package-files-artifact-name }}
          path: ${{ runner.temp }}/arch-package-files
      - name: Build package
        uses: $/.github/actions/build-arch-package
        with:
          stage: build
          packageName: ${{ inputs.package-name }}
          packageFilesArtifactName: ${{ inputs.package-files-artifact-name }}
          pkgbuildPath: ${{ inputs.pkgbuild-path }}
          sourceRepository: ${{ github.repository }}
          sourceSha: ${{ github.sha }}
      - name: Upload package candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-package-candidate-${{ inputs.package-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arch-package-candidate.tar
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Validate package artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Download package candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-package-candidate-${{ inputs.package-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-envelope
      - name: Install package inspection tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - name: Validate package candidate
        uses: $/.github/actions/build-arch-package
        with:
          stage: validate
          packageName: ${{ inputs.package-name }}
          sourceRepository: ${{ github.repository }}
          sourceSha: ${{ github.sha }}
      - name: Set artifact name
        id: artifact
        run: |
          echo "name=arch-package-${{ inputs.package-name }}-${{ github.run_id }}-${{ github.run_attempt }}" \
            >> "$GITHUB_OUTPUT"
      - name: Upload validated package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/candidate.tar
          if-no-files-found: error
          retention-days: 7

  dispatch:
    name: Dispatch publication
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch validated package
        env:
          GH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
        uses: $/.github/actions/build-arch-package
        with:
          stage: dispatch
          packageName: ${{ inputs.package-name }}
          sourceRepository: ${{ github.repository }}
          sourceSha: ${{ github.sha }}
          sourceRunId: ${{ github.run_id }}
          artifactName: ${{ needs.validate.outputs.artifact-name }}
