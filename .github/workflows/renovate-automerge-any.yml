---
name: Renovate - Auto-merge (any)

# yamllint disable-line rule:truthy
on:
  workflow_run:
    workflows:
      - Validate actions
    types:
      - completed

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  renovate-automerge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    steps:
      - name: Enable auto-merge for Renovate PRs
        run: |
          set -euo pipefail
          author="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json author --jq .author.login)"
          if [[ "$author" != "app/renovate" && "$author" != "renovate[bot]" ]]; then
            exit 0
          fi
          gh pr merge --auto --squash "$PR_NUMBER" --repo "$GH_REPO"
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
