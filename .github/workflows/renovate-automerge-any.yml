---
name: Renovate - Auto-merge (any)

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  workflow_run:
    workflows:
      - Validate actions
    types:
      - completed
  workflow_dispatch: {}

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  renovate-automerge:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null) ||
      (github.event_name != 'workflow_run' &&
      (github.actor == 'renovate[bot]' || github.actor == 'renovate-bot'))
    steps:
      - name: Enable auto-merge for Renovate PRs
        run: |
          set -euo pipefail
          author="$(gh pr view "$PR_URL" --json author --jq .author.login)"
          if [[ "$author" != "app/renovate" && "$author" != "renovate[bot]" ]]; then
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.workflow_run.pull_requests[0].html_url || github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
