---
name: "Sync labels"

# Labels are synced by upkeep from groundwork's conventions now
# (https://github.com/timmo001/upkeep). This stays so callers don't break,
# and does nothing.

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      labels-ref:
        description: "Unused; kept so existing callers still validate"
        required: false
        type: string
        default: "master"

permissions: {}

jobs:
  labels:
    name: ♻️ Sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: ℹ️ Labels are synced by upkeep
        run: echo "Labels are synced by upkeep from groundwork's conventions."
