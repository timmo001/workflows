---
name: Publish AUR

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      package-name:
        description: "AUR package base to publish"
        required: true
        type: string
      artifact-name:
        description: "Artifact containing the final AUR files"
        required: true
        type: string
      pkgbuild-path:
        description: "Path to the final PKGBUILD within the artifact"
        required: false
        type: string
        default: "PKGBUILD"
      auxiliary-file-paths:
        description: "Newline-separated auxiliary file paths within the artifact"
        required: false
        type: string
        default: ""
      arch-image:
        description: "Arch Linux image used to build and validate the package"
        required: false
        type: string
        # renovate-container: datasource=docker depName=ghcr.io/timmo001/system-bridge/ci-build-arch
        default: "ghcr.io/timmo001/system-bridge/ci-build-arch:latest@sha256:7860abed58de36b5f5779b9f252aa5a5ad3fb161251996fa7d119fad67a9e427"
    secrets:
      AUR_SSH_PRIVATE_KEY:
        description: "SSH private key authorised to publish the AUR package"
        required: true
    outputs:
      changed:
        description: "Whether an AUR commit was pushed"
        value: ${{ jobs.publish-package.outputs.changed }}

permissions:
  contents: read

concurrency:
  group: publish-aur-${{ inputs.package-name }}
  cancel-in-progress: false

jobs:
  validate-package:
    name: Validate AUR package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ${{ inputs.arch-image }}
    steps:
      - name: Download package files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/aur-input
      - name: Build and validate package
        uses: $/.github/actions/publish-aur
        with:
          stage: validate
          packageName: ${{ inputs.package-name }}
          pkgbuildPath: ${{ inputs.pkgbuild-path }}
          auxiliaryFilePaths: ${{ inputs.auxiliary-file-paths }}

      - name: Upload validated package files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aur-validated-${{ inputs.package-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aur-validated
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish-package:
    name: Publish AUR package
    needs: validate-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Download validated package files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aur-validated-${{ inputs.package-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aur-validated
      - name: Verify validated package files
        uses: $/.github/actions/publish-aur
        with:
          stage: verify
          packageName: ${{ inputs.package-name }}
      - name: Prepare AUR commit
        id: changes
        uses: $/.github/actions/publish-aur
        with:
          stage: prepare
          packageName: ${{ inputs.package-name }}
      - name: Push AUR commit
        if: steps.changes.outputs.changed == 'true'
        uses: $/.github/actions/publish-aur
        with:
          stage: push
          packageName: ${{ inputs.package-name }}
          aurSshPrivateKey: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
