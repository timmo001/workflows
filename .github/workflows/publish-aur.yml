---
name: Publish AUR

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      package-name:
        description: "AUR package base to publish"
        required: true
        type: string
      artifact-name:
        description: "Artifact containing the final AUR files; leave empty when prepare-command makes them"
        required: false
        type: string
        default: ""
      prepare-command:
        description: >-
          Trusted shell command that writes the final AUR files to $AUR_PACKAGE_DIR from the full git history, such as
          .scripts/linux/prepare-aur.sh "$AUR_PACKAGE_DIR"; used instead of artifact-name
        required: false
        type: string
        default: ""
      prepare-mise:
        description: "Install the caller's mise tools before prepare-command runs"
        required: false
        type: boolean
        default: false
      pkgbuild-path:
        description: "Path to the final PKGBUILD within the artifact"
        required: false
        type: string
        default: "PKGBUILD"
      auxiliary-file-paths:
        description: "Newline-separated auxiliary file paths within the artifact"
        required: false
        type: string
        default: ""
      arch-image:
        description: "Arch Linux image used to build and validate the package"
        required: false
        type: string
        # renovate-container: datasource=docker depName=ghcr.io/timmo001/system-bridge/ci-build-arch
        default: "ghcr.io/timmo001/system-bridge/ci-build-arch:latest@sha256:16b8425e7bfa45d32cfb545821fa8e49bb2ef29b3739e21b7096a43fea80b02a"
    secrets:
      AUR_SSH_PRIVATE_KEY:
        description: "SSH private key authorised to publish the AUR package"
        required: true
    outputs:
      changed:
        description: "Whether an AUR commit was pushed"
        value: ${{ jobs.publish-package.outputs.changed }}

permissions:
  contents: read

concurrency:
  group: publish-aur-${{ inputs.package-name }}
  cancel-in-progress: false

jobs:
  prepare-package:
    name: Prepare AUR package
    if: inputs.prepare-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        if: ${{ !inputs.prepare-mise }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out with mise
        if: inputs.prepare-mise
        uses: $/.github/actions/checkout-mise
        with:
          fetch-depth: 0
      - name: Prepare package files
        env:
          AUR_PACKAGE_DIR: ${{ runner.temp }}/aur-package
          PREPARE_COMMAND: ${{ inputs.prepare-command }}
        run: |
          mkdir -p "$AUR_PACKAGE_DIR"
          bash -euo pipefail -c "$PREPARE_COMMAND"
      - name: Upload package files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur-${{ inputs.package-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aur-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  validate-package:
    name: Validate AUR package
    needs: prepare-package
    # Runs after prepare-package, or without it when the caller passes artifact-name
    if: >-
      !cancelled() && (needs.prepare-package.result == 'success' || (needs.prepare-package.result == 'skipped' &&
      inputs.artifact-name != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ${{ inputs.arch-image }}
    steps:
      - name: Download package files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: >-
            ${{ inputs.artifact-name || format('aur-{0}-{1}-{2}', inputs.package-name, github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/aur-input
      - name: Build and validate package
        uses: $/.github/actions/publish-aur
        with:
          stage: validate
          packageName: ${{ inputs.package-name }}
          pkgbuildPath: ${{ inputs.pkgbuild-path }}
          auxiliaryFilePaths: ${{ inputs.auxiliary-file-paths }}

      - name: Upload validated package files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur-validated-${{ inputs.package-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aur-validated
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish-package:
    name: Publish AUR package
    needs: validate-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Download validated package files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur-validated-${{ inputs.package-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aur-validated
      - name: Verify validated package files
        uses: $/.github/actions/publish-aur
        with:
          stage: verify
          packageName: ${{ inputs.package-name }}
      - name: Prepare AUR commit
        id: changes
        uses: $/.github/actions/publish-aur
        with:
          stage: prepare
          packageName: ${{ inputs.package-name }}
      - name: Push AUR commit
        if: steps.changes.outputs.changed == 'true'
        uses: $/.github/actions/publish-aur
        with:
          stage: push
          packageName: ${{ inputs.package-name }}
          aurSshPrivateKey: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
