---
name: Build Bun CLI

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      smoke-test:
        description: >-
          Trusted multi-line shell commands run after the build; empty skips the smoke test
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Check, test and build
        run: "mise run check ::: test ::: build"
      - name: Smoke test
        if: inputs.smoke-test != ''
        env:
          SMOKE_TEST: ${{ inputs.smoke-test }}
        run: bash -euo pipefail -c "$SMOKE_TEST"
