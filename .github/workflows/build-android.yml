---
# Builds an Android app with mise and the caller's commands and uploads its
# APKs, so pull requests check the app still builds with the pinned SDK, JDK
# and Gradle. Its inputs match publish-android-release.yml, which signs and
# publishes the same build on a release. Callers own the triggers and the
# concurrency.
name: Build Android app

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory with the app's mise.toml, where the commands run"
        required: false
        type: string
        default: "."
      mise-install-args:
        description: "Tools mise installs, space-separated, when not all of them, such as java gradle android-sdk"
        required: false
        type: string
        default: ""
      setup-command:
        description: "Trusted shell command run before the build, such as installing the SDK packages and dependencies"
        required: false
        type: string
        default: ""
      build-command:
        description: "Trusted shell command that builds the APKs"
        required: true
        type: string
      apk-directory:
        description: "Workspace-relative directory of the APKs the build writes, uploaded as artifact-name"
        required: true
        type: string
      artifact-name:
        description: "Name of the uploaded APK artifact"
        required: false
        type: string
        default: android-apk
      timeout-minutes:
        description: "Minutes before the job is cancelled"
        required: false
        type: number
        default: 45

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      # mise only reads a mise.toml outside the workspace root once it's trusted
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/${{ inputs.working-directory }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out with mise
        uses: $/.github/actions/checkout-mise
        with:
          install-args: ${{ inputs.mise-install-args }}
          working-directory: ${{ inputs.working-directory }}
      - name: Set up the build
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$SETUP_COMMAND"
      - name: Build the APKs
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"
      - name: Upload the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.apk-directory }}
          if-no-files-found: error
