---
name: Lint - ActionLint

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_call:
    inputs:
      actionlint-version:
        description: "actionlint version to use"
        required: false
        type: string
        # renovate: datasource=github-releases depName=rhysd/actionlint
        default: "1.7.12"
  workflow_dispatch:

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  lint-actionlint:
    name: 👕 ActionLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⤵️ Set up actionlint
        uses: $/.github/actions/setup-actionlint
        with:
          version: ${{ inputs.actionlint-version || env.ACTIONLINT_VERSION }}
      - name: 🚀 Run actionlint
        run: actionlint
