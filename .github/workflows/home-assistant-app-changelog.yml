---
name: Home Assistant app changelog

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      changelog-path:
        description: "The app's CHANGELOG.md, such as my-app/CHANGELOG.md"
        required: true
        type: string
    secrets:
      token:
        description: >-
          Token that can push to the default branch, such as a fine-grained token from an admin with Contents write,
          when a ruleset blocks GITHUB_TOKEN
        required: true

jobs:
  # The Supervisor shows the app's CHANGELOG.md from the default branch in the
  # update dialog, so copy the release notes there. A missing changelog
  # shouldn't fail the release, so failures only warn.
  changelog:
    name: Changelog
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.token }}

      - name: Write changelog
        env:
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: printf '%s\n' "$RELEASE_NOTES" | tr -d '\r' > "$CHANGELOG_PATH"

      - name: Commit changelog
        env:
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$CHANGELOG_PATH"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHANGELOG_PATH"
          git commit -m "Update Home Assistant app changelog for $RELEASE_VERSION"
          git push

      - name: Warn about missing changelog
        if: ${{ failure() }}
        env:
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
        run: echo "::warning title=Home Assistant app changelog::Couldn't commit the release notes to $CHANGELOG_PATH. Check the token, then update the file by hand."
