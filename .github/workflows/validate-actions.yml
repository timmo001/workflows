---
name: Validate actions

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-actions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and check bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install test system dependencies
        run: sudo apt-get install --yes libarchive-tools python3-packaging
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate
        run: bun run validate

  smoke:
    name: Same-revision action smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:latest@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a # renovate-container: datasource=docker depName=archlinux
    steps:
      - name: Run foundation smoke via self-repository syntax
        id: smoke
        uses: $/.github/actions/foundation-smoke
        with:
          message: foundation-ok
      - name: Confirm echoed output
        run: |
          set -euo pipefail
          [[ "${{ steps.smoke.outputs.echoed }}" == "foundation-ok" ]]
