---
name: Validate actions

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-actions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and check bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Install test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools python3-packaging
      - name: Validate
        run: mise run -c validate

  smoke:
    name: Same-revision action smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:latest@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899 # renovate-container: datasource=docker depName=archlinux
    steps:
      - name: Run foundation smoke via self-repository syntax
        id: smoke
        uses: $/.github/actions/foundation-smoke
        with:
          message: foundation-ok
      - name: Confirm echoed output
        run: |
          set -euo pipefail
          [[ "${{ steps.smoke.outputs.echoed }}" == "foundation-ok" ]]
