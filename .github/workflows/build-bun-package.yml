---
name: Build Bun package

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      bun-version:
        description: "Bun version"
        required: false
        type: string
        # renovate: datasource=npm depName=bun
        default: "1.4.0"
      node-version:
        description: "Node.js version used for npm package inspection"
        required: false
        type: string
        # renovate: datasource=node-version depName=node versioning=node
        default: "26.8.1"
      package-path:
        description: "Directory containing the package"
        required: false
        type: string
        default: "."
      check-command:
        description: "Trusted command that validates the package"
        required: false
        type: string
        default: "bun run check"
      build-command:
        description: "Trusted command that builds the package"
        required: false
        type: string
        default: "bun run build"
      jsr-cli-version:
        description: "JSR CLI version used for package validation"
        required: false
        type: string
        # renovate: datasource=npm depName=jsr
        default: "0.14.3"

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ${{ inputs.package-path }}
      - name: Validate package
        env:
          CHECK_COMMAND: ${{ inputs.check-command }}
          BUILD_COMMAND: ${{ inputs.build-command }}
          JSR_CLI_VERSION: ${{ inputs.jsr-cli-version }}
        shell: bash
        working-directory: ${{ inputs.package-path }}
        run: |
          set -euo pipefail
          # These commands are trusted caller configuration, not pull request content.
          bash -euo pipefail -c "$CHECK_COMMAND"
          bash -euo pipefail -c "$BUILD_COMMAND"
          npm pack --dry-run
          bunx "jsr@$JSR_CLI_VERSION" publish --dry-run
