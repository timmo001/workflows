---
name: Publish JSR package

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      bun-version:
        description: "Bun version"
        required: false
        type: string
        # renovate: datasource=npm depName=bun
        default: "1.4.2"
      jsr-cli-version:
        description: "JSR CLI version"
        required: false
        type: string
        # renovate: datasource=npm depName=jsr
        default: "0.14.3"
      package-path:
        description: "Directory containing the package"
        required: false
        type: string
        default: "."
      check-command:
        description: "Trusted command that validates the package"
        required: false
        type: string
        default: "bun run check"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ${{ inputs.package-path }}
      - name: Validate release
        uses: $/.github/actions/validate-js-package
        with:
          contract: jsr
          packagePath: ${{ inputs.package-path }}
          checkCommand: ${{ inputs.check-command }}
          releaseTag: ${{ github.event.release.tag_name || github.ref_name }}
      - name: Publish package
        env:
          JSR_CLI_VERSION: ${{ inputs.jsr-cli-version }}
        run: bunx "jsr@$JSR_CLI_VERSION" publish
        working-directory: ${{ inputs.package-path }}
