---
name: Publish JSR package

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      bun-version:
        description: "Bun version"
        required: false
        type: string
        # renovate: datasource=npm depName=bun
        default: "1.4.0"
      jsr-cli-version:
        description: "JSR CLI version"
        required: false
        type: string
        # renovate: datasource=npm depName=jsr
        default: "0.14.3"
      package-path:
        description: "Directory containing the package"
        required: false
        type: string
        default: "."
      check-command:
        description: "Trusted command that validates the package"
        required: false
        type: string
        default: "bun run check"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ${{ inputs.package-path }}
      - name: Validate release
        env:
          CHECK_COMMAND: ${{ inputs.check-command }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        shell: bash
        working-directory: ${{ inputs.package-path }}
        run: |
          set -euo pipefail
          package_version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          jsr_version="$(bun -e 'console.log((await Bun.file("jsr.json").json()).version)')"
          [[ "$package_version" == "$jsr_version" ]] || {
            echo "::error::package.json and jsr.json versions differ"
            exit 1
          }
          [[ "$RELEASE_TAG" == "v$package_version" ]] || {
            echo "::error::Release tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          }
          # This command is trusted caller configuration, not release content.
          bash -euo pipefail -c "$CHECK_COMMAND"
      - name: Publish package
        env:
          JSR_CLI_VERSION: ${{ inputs.jsr-cli-version }}
        run: bunx "jsr@$JSR_CLI_VERSION" publish
        working-directory: ${{ inputs.package-path }}
