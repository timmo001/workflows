---
name: Sync action bundles

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - src/**
      - scripts/bundle.ts
      - package.json
      - bun.lock
      - mise.toml
      - tsconfig.json
      - .github/actions/**/action.yml

permissions:
  contents: write

concurrency:
  group: sync-action-bundles-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: Rebuild bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Rebuild action bundles
        run: mise run bundle
      - name: Detect bundle changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/actions; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Commit bundle updates to the pull request
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/actions
          git commit -m "Rebuild action bundles"
          git push
