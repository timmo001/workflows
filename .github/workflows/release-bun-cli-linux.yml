---
name: Release Bun CLI - Linux

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      binary-name:
        description: "Compiled executable name"
        required: true
        type: string
      package-name:
        description: "Package and release asset base name; defaults to binary-name"
        required: false
        type: string
        default: ""
      entrypoint:
        description: "Bun entrypoint to compile"
        required: true
        type: string
      package-config:
        description: "nFPM configuration owned by the caller"
        required: true
        type: string
      bun-version:
        description: "Bun version used to install and compile"
        required: false
        type: string
        default: "1.3.14"
      smoke-test-arguments:
        description: >-
          Trusted newline-separated executable argument lists; each line is one invocation
        required: false
        type: string
        default: "--version"
      package-prepare-command:
        description: >-
          Trusted shell command run after compilation and before nFPM packaging
        required: false
        type: string
        default: ""
      archive-extra-paths:
        description: >-
          Trusted newline-separated paths under dist/release/root to include in release archives
        required: false
        type: string
        default: ""
      prerelease:
        description: "Publish the GitHub release as a prerelease"
        required: false
        type: boolean
        default: true
      release-version:
        description: "Existing release tag; empty allocates YYYYMMDD.N"
        required: false
        type: string
        default: ""
      source-ref:
        description: "Git ref to build; empty uses the triggering SHA"
        required: false
        type: string
        default: ""
      existing-release:
        description: "Upload assets to an existing release without editing it"
        required: false
        type: boolean
        default: false
    outputs:
      release-version:
        description: "Allocated YYYYMMDD.N release version"
        value: ${{ jobs.release.outputs.release-version }}
      source-sha:
        description: "Full source commit SHA used for the release"
        value: ${{ jobs.release.outputs.source-sha }}

permissions:
  contents: read

concurrency:
  group: release-bun-cli-linux-${{ github.repository }}
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=goreleaser/nfpm
  NFPM_VERSION: "2.47.0"

jobs:
  version:
    name: Allocate release version
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.version.outputs.release-version }}
      source-sha: ${{ steps.version.outputs.source-sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Allocate YYYYMMDD.N version
        id: version
        uses: $/.github/actions/release-bun-cli
        with:
          stage: allocate-version
          releaseVersion: ${{ inputs.release-version }}

  build:
    name: Build Linux ${{ matrix.architecture }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Validate inputs
        uses: $/.github/actions/release-bun-cli
        with:
          stage: validate-inputs
          binaryName: ${{ inputs.binary-name }}
          packageName: ${{ inputs.package-name }}
          entrypoint: ${{ inputs.entrypoint }}
          packageConfig: ${{ inputs.package-config }}
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile executable
        uses: $/.github/actions/release-bun-cli
        with:
          stage: compile
          binaryName: ${{ inputs.binary-name }}
          packageName: ${{ inputs.package-name }}
          entrypoint: ${{ inputs.entrypoint }}
          packageConfig: ${{ inputs.package-config }}
          architecture: ${{ matrix.architecture }}
      - name: Smoke-test executable
        uses: $/.github/actions/release-bun-cli
        with:
          stage: smoke-test
          binaryName: ${{ inputs.binary-name }}
          smokeTestArguments: ${{ inputs.smoke-test-arguments }}
      - name: Prepare package files
        if: inputs.package-prepare-command != ''
        uses: $/.github/actions/release-bun-cli
        with:
          stage: prepare-package
          packagePrepareCommand: ${{ inputs.package-prepare-command }}
      - name: Install nFPM
        uses: $/.github/actions/release-bun-cli
        with:
          stage: install-nfpm
          architecture: ${{ matrix.architecture }}
          nfpmVersion: ${{ env.NFPM_VERSION }}
      - name: Build archives and packages
        uses: $/.github/actions/release-bun-cli
        with:
          stage: build-assets
          binaryName: ${{ inputs.binary-name }}
          packageName: ${{ inputs.package-name }}
          entrypoint: ${{ inputs.entrypoint }}
          packageConfig: ${{ inputs.package-config }}
          architecture: ${{ matrix.architecture }}
          archiveExtraPaths: ${{ inputs.archive-extra-paths }}
          releaseVersion: ${{ needs.version.outputs.release-version }}
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.binary-name }}-${{ matrix.architecture }}-${{ github.run_id }}
          path: dist/release/assets
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    name: Publish rolling release
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-version: ${{ needs.version.outputs.release-version }}
      source-sha: ${{ needs.version.outputs.source-sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Download x86_64 assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.binary-name }}-x86_64-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets
      - name: Download aarch64 assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.binary-name }}-aarch64-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets
      - name: Verify assets and create checksums
        uses: $/.github/actions/release-bun-cli
        with:
          stage: verify-assets
          assetRoot: ${{ runner.temp }}/release-assets
      - name: Publish GitHub prerelease
        uses: $/.github/actions/release-bun-cli
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          stage: publish-release
          assetRoot: ${{ runner.temp }}/release-assets
          prerelease: "${{ inputs.prerelease }}"
          existingRelease: "${{ inputs.existing-release }}"
          releaseVersion: ${{ needs.version.outputs.release-version }}
          sourceSha: ${{ needs.version.outputs.source-sha }}
