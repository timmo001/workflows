---
name: Check out with mise
description: Check out the caller's repository and install its mise tools
inputs:
  fetch-depth:
    description: Commits to check out; 0 fetches the full history
    required: false
    default: "1"
  install-args:
    description: Tools mise installs, as mise-action's install_args; empty installs every tool in the config
    required: false
    default: ""
  working-directory:
    description: Directory, relative to the workspace, whose mise config is installed
    required: false
    default: "."
  locked:
    description: >-
      "true" installs with mise install --locked when the repository has a mise lock file, which fails for a tool
      the lock has no full entry for; "false" installs without it
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: ${{ inputs.fetch-depth }}
    # mise-action adds --locked whenever it finds a lock file, so an unlocked
    # install runs mise install itself, with its own cache of mise's tools
    - name: Restore mise tools
      if: inputs.locked != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise
        key: >-
          checkout-mise-${{ runner.os }}-${{ runner.arch }}-${{ inputs.working-directory }}-${{ inputs.install-args }}-${{
          hashFiles('**/mise.toml', '**/.mise.toml', '**/mise.*.toml', '**/mise.lock', '**/.tool-versions') }}
    - name: Set up mise
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        install: ${{ inputs.locked == 'true' }}
        cache: ${{ inputs.locked == 'true' }}
        install_args: ${{ inputs.install-args }}
        working_directory: ${{ inputs.working-directory }}
    - name: Install mise tools
      if: inputs.locked != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: |
        read -ra args <<< "$INSTALL_ARGS"
        mise install "${args[@]}"
