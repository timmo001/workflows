[tools]
bun = "1.4.5"
node = "26.13.1"
pkl = "0.33.1"
# The linters the hk pre-push hook runs, matching CI.
uv = "0.13.9"
# yamllint's PyYAML has no wheels for newer Pythons, and mise won't build it from source.
python = "3.14.10"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"
sources = ["package.json", "bun.lock"]

[tasks.bundle]
description = "Rebuild the committed action bundles"
depends = ["install"]
run = "bun run bundle"

[tasks."bundle:check"]
description = "Check the action bundles match their sources"
depends = ["install"]
run = "bun run bundle:check"

[tasks.lint]
description = "Lint TypeScript with Oxlint"
depends = ["install"]
run = "bun run lint"

[tasks.typecheck]
description = "Type-check the action sources"
depends = ["install"]
run = "bun run typecheck"

[tasks.test]
description = "Run the action tests"
depends = ["install"]
run = "bun run test"

[tasks.format]
description = "Format sources with Prettier"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.validate]
description = "Run every check in parallel"
depends = ["lint", "typecheck", "test", "format:check", "bundle:check"]

[tasks."hk:package"]
description = "Package the shared hk base for a release (RELEASE_TAG sets the version)"
run = "pkl project package hk --output-path dist-hk"
